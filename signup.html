<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall of Shame - Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", monospace;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .signup-container {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #333;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #333;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .login-link a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }

        body {
            background: #080808;
            color: #f4f0e6;
            font-family: "Courier New", monospace;
        }

        body,
        button,
        input {
            font-family: "Courier New", monospace;
        }

        .signup-container {
            background: #151515;
            border: 1px solid #343434;
            box-shadow: 8px 8px 0 #000, 0 0 35px rgba(45, 226, 194, 0.18);
        }

        .subtitle,
        .login-link {
            color: #aaa;
        }

        .input-group input {
            background: #0d0d0d;
            color: #f4f0e6;
            border-color: #3b3b3b;
        }

        .input-group input:focus {
            border-color: #2de2c2;
        }

        .signup-btn {
            background: #2de2c2;
            color: #111;
        }

        .signup-btn:hover {
            background: #8ff9e7;
        }

        .login-link a {
            color: #2de2c2;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">Join the Wall 😈</div>

        <p class="subtitle">
            Create your account and face the consequences.
        </p>

        <form id="signupForm" action="team.html">

            <div class="input-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="index.html">Login</a>
        </p>

    </div>

 
<script type="module">
    import { auth, db } from "./firebase-config.js";
import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import {
        createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const signupForm = document.getElementById("signupForm");

    signupForm.addEventListener("submit", async function(event) {

        event.preventDefault();
const name =
    document.getElementById("name").value;
        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm-password").value;


        if (password !== confirmPassword) {

            alert("Passwords do not match!");

            return;
        }


        try {

           const userCredential =
    await createUserWithEmailAndPassword(
        auth,
        email,
        password
    );

const user = userCredential.user;

await setDoc(doc(db, "users", user.uid), {
    name: name,
    email: email
});
            alert("Account created successfully! 🎉");

            sessionStorage.setItem(
                "requireInitialPhoto",
                "true"
            );

            window.location.href = "team.html";

        } catch (error) {

            alert(error.message);

        }

    });
</script>
</body>
</html>
